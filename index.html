<body>
<iframe id="app" title="Ramp Calculator"></iframe>

<script>
(async () => {
  const SOURCES = [
    "https://raw.githubusercontent.com/PixelArchitectureStudio/Ramp-Test01/1df57f3c4cb110952af5e643e51155d8a7793b84/index.html",
    "https://cdn.jsdelivr.net/gh/PixelArchitectureStudio/Ramp-Test01@1df57f3c4cb110952af5e643e51155d8a7793b84/index.html"
  ];
  const frame = document.getElementById("app");

  try {
    let source = "";
    let lastError = null;

    for (const url of SOURCES) {
      try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) throw new Error("HTTP " + response.status);
        source = await response.text();
        if (source.includes('id="rampDrawing"') && source.includes('id="downloadBtn"')) break;
        source = "";
      } catch (error) {
        lastError = error;
      }
    }

          <div style="opacity:.55;font-weight:500">${String(error?.message || error)}</div>
        </div>
      </div>`;
  }
})();
</script>
</body>
