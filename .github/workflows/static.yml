name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build true vector PDF export version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.index('      async function downloadPDF() {')
          end = s.index('      function downloadDXF()', start)

          vector_code = r'''      function pdfLen(m) {
        const v = Number(m) || 0;
        return selectedLengthUnit() === "cm" ? `${(v * 100).toFixed(0)} cm` : `${v.toFixed(2)} m`;
      }

      function pdfDim(pdf, x1, x2, y, label) {
        if (!(x2 > x1)) return;
        pdf.setDrawColor(90,100,120);
        pdf.setLineWidth(.2);
        pdf.line(x1,y,x2,y);
        pdf.line(x1,y-2,x1,y+2);
        pdf.line(x2,y-2,x2,y+2);
        pdf.line(x1,y,x1+1.5,y-.8);
        pdf.line(x1,y,x1+1.5,y+.8);
        pdf.line(x2,y,x2-1.5,y-.8);
        pdf.line(x2,y,x2-1.5,y+.8);
        pdf.setFont("helvetica","normal");
        pdf.setFontSize(7);
        pdf.setTextColor(45,55,75);
        pdf.text(label,(x1+x2)/2,y-1.5,{align:"center"});
      }

      function drawPdfPlan(pdf, r, x, y, w, h) {
        const g = buildRampGeometry(r);
        const sx = Math.min(w / Math.max(g.totalX,.01), h / Math.max(g.widthM,.01));
        const dw = g.totalX * sx, dh = g.widthM * sx;
        const ox = x + (w-dw)/2, oy = y + (h-dh)/2;
        const X = v => ox + v*sx;

        pdf.setFont("helvetica","bold"); pdf.setFontSize(10); pdf.setTextColor(20,28,45);
        pdf.text("PLAN",x,y-5);
        pdf.setDrawColor(28,36,55); pdf.setLineWidth(.45); pdf.rect(ox,oy,dw,dh);
        g.points.slice(1,-1).forEach(p => { const px=X(p.x); pdf.setDrawColor(155,165,185); pdf.setLineWidth(.2); pdf.line(px,oy,px,oy+dh); });
        pdf.setLineDashPattern([2,1.5],0); pdf.setDrawColor(170,178,195); pdf.line(ox,oy+dh/2,ox+dw,oy+dh/2); pdf.setLineDashPattern([],0);

        pdfDim(pdf,ox,ox+dw,oy-6,`TOTAL ${pdfLen(g.totalX)}`);
        const dy = oy+dh+7;
        g.segments.forEach((seg,i)=>{
          const name = state.type === "car" ? (seg.kind === "stop" ? "STOP" : i===0 ? `${Number(seg.slopePct||0)}% START` : i===1 ? `MAIN ${Number(seg.slopePct||0)}%` : `${Number(seg.slopePct||0)}% END`) : (seg.kind === "landing" ? "LANDING" : "RAMP");
          pdfDim(pdf,X(seg.start.x),X(seg.end.x),dy,`${name}  ${pdfLen(seg.len)}`);
        });

        const dx=ox-6;
        pdf.setDrawColor(90,100,120); pdf.setLineWidth(.2); pdf.line(dx,oy,dx,oy+dh); pdf.line(dx-2,oy,ox,oy); pdf.line(dx-2,oy+dh,ox,oy+dh);
        pdf.setFontSize(7); pdf.text(pdfLen(g.widthM),dx-1.5,oy+dh/2,{angle:90,align:"center"});
      }

      function drawPdfSection(pdf, r, x, y, w, h) {
        const g = buildRampGeometry(r);
        const sx = Math.min(w / Math.max(g.totalX,.01), h / Math.max(g.totalRise||g.heightM,.01));
        const dw = g.totalX*sx, dh=(g.totalRise||g.heightM)*sx;
        const ox=x+(w-dw)/2, by=y+h;
        const X=v=>ox+v*sx, Y=v=>by-v*sx;

        pdf.setFont("helvetica","bold"); pdf.setFontSize(10); pdf.setTextColor(20,28,45); pdf.text("SECTION",x,y-5);
        pdf.setDrawColor(155,165,185); pdf.setLineWidth(.2); pdf.line(ox,by,ox+dw,by);
        pdf.setDrawColor(25,33,52); pdf.setLineWidth(.55);
        g.segments.forEach(seg=>{
          if(seg.kind==="stop") pdf.setLineDashPattern([2.2,1.5],0); else pdf.setLineDashPattern([],0);
          pdf.line(X(seg.start.x),Y(seg.start.z),X(seg.end.x),Y(seg.end.z)); pdf.setLineDashPattern([],0);
          const px=Math.abs(X(seg.end.x)-X(seg.start.x));
          if(px>18){ pdf.setFont("helvetica","normal"); pdf.setFontSize(6.8); pdf.setTextColor(55,65,85); pdf.text(seg.kind==="stop"?`STOP ${pdfLen(seg.len)}`:`${Number(seg.slopePct||0)}%  ${pdfLen(seg.len)}`,(X(seg.start.x)+X(seg.end.x))/2,(Y(seg.start.z)+Y(seg.end.z))/2-2.5,{align:"center"}); }
        });

        pdfDim(pdf,ox,ox+dw,y-1.5,`TOTAL ${pdfLen(g.totalX)}`);
        const dy=by+7;
        g.segments.forEach((seg,i)=>{
          const name = state.type === "car" ? (seg.kind === "stop" ? "STOP" : i===0 ? `${Number(seg.slopePct||0)}% START` : i===1 ? `MAIN ${Number(seg.slopePct||0)}%` : `${Number(seg.slopePct||0)}% END`) : (seg.kind === "landing" ? "LANDING" : "RAMP");
          pdfDim(pdf,X(seg.start.x),X(seg.end.x),dy,`${name}  ${pdfLen(seg.len)}`);
        });

        const dx=ox-7;
        pdf.setDrawColor(90,100,120); pdf.setLineWidth(.2); pdf.line(dx,Y(0),dx,Y(g.totalRise)); pdf.line(dx-2,Y(0),ox,Y(0)); pdf.line(dx-2,Y(g.totalRise),ox,Y(g.totalRise));
        pdf.setFont("helvetica","normal"); pdf.setFontSize(7); pdf.setTextColor(45,55,75); pdf.text(pdfLen(g.totalRise),dx-1.5,(Y(0)+Y(g.totalRise))/2,{angle:90,align:"center"});
      }

      async function downloadPDF() {
        try {
          if(!window.jspdf?.jsPDF) throw new Error("jsPDF unavailable");
          const r = state.result || calculateCurrent(true) || invalidResult();
          if(!r.valid || r.blocked) throw new Error("No valid result");
          const {jsPDF}=window.jspdf;
          const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true});
          const W=pdf.internal.pageSize.getWidth(), H=pdf.internal.pageSize.getHeight(), m=16;
          const g=buildRampGeometry(r), heightM=Number(r.params?.heightCm||0)/100;

          pdf.setFillColor(255,255,255); pdf.rect(0,0,W,H,"F");
          pdf.setFont("helvetica","bold"); pdf.setFontSize(17); pdf.setTextColor(18,26,44); pdf.text("Ramp Calculation Tool - Technical Sheet",m,14);
          let summary="";
          if(state.type==="car") summary=`CAR RAMP | HEIGHT ${heightM.toFixed(2)} m | MAIN SLOPE ${Number(r.params?.slope||0)}% | ENTRY / EXIT ${Number(r.params?.transitionSlope||0)}% | OVERALL ${g.totalX.toFixed(2)} m`;
          else if(state.type==="disabled") summary=`ACCESSIBLE RAMP | HEIGHT ${heightM.toFixed(2)} m | SLOPE ${Number(r.params?.slope||0)}% | OVERALL ${g.totalX.toFixed(2)} m`;
          else summary=`GENERAL RAMP | HEIGHT ${heightM.toFixed(2)} m | SLOPE ${Number(r.params?.slope||0)}% | OVERALL ${g.totalX.toFixed(2)} m`;
          pdf.setFont("helvetica","normal"); pdf.setFontSize(8.5); pdf.setTextColor(80,92,115); pdf.text(summary,m,20);
          pdf.setDrawColor(121,161,253); pdf.setLineWidth(.5); pdf.line(m,24,W-m,24);

          drawPdfPlan(pdf,r,m+5,39,W-(m+5)*2,42);
          pdf.setDrawColor(222,227,235); pdf.setLineWidth(.25); pdf.line(m,98,W-m,98);
          drawPdfSection(pdf,r,m+5,115,W-(m+5)*2,46);

          pdf.setDrawColor(205,212,224); pdf.setLineWidth(.25); pdf.line(m,H-13,W-m,H-13);
          pdf.setFont("helvetica","normal"); pdf.setFontSize(7.8); pdf.setTextColor(110,120,140); pdf.text("Generated from Ramp Calculator",m,H-7.5);
          pdf.setFont("helvetica","bold"); pdf.text("Pixel Studio",W-m,H-7.5,{align:"right"});

          pdf.save(`ramp-${state.type}-vector-technical-sheet-${selectedLengthUnit()}.pdf`);
          showToast(state.lang === "fa" ? "PDF وکتور دانلود شد" : "Vector PDF downloaded");
        } catch(error) { console.error(error); showToast(state.lang === "fa" ? "خطا در ساخت PDF" : "PDF export failed"); }
      }

'''
          s = s[:start] + vector_code + s[end:]
          s = re.sub(r'\s*<script src="https://cdnjs\.cloudflare\.com/ajax/libs/html2canvas/1\.4\.1/html2canvas\.min\.js"></script>\s*','\n',s,count=1)
          s = re.sub(r'(<div class="footer-pill" id="versionBadge">)v[^<]+(</div>)',r'\1v2.10.9\2',s,count=1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
