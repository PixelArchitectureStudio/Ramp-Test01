name: Apply true vector PDF export

on:
  push:
    paths:
      - '.github/workflows/vector-pdf-export.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace PDF export with vector technical sheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start = s.find('      async function downloadPDF() {')
          end = s.find('      function downloadDXF()', start)
          if start < 0 or end < 0:
              raise SystemExit('downloadPDF/downloadDXF boundary not found')

          new_pdf = r'''      function pdfLength(valueM) {
        const v = Number(valueM) || 0;
        return selectedLengthUnit() === "cm" ? `${(v * 100).toFixed(0)} cm` : `${v.toFixed(2)} m`;
      }

      function pdfDim(pdf, x1, x2, y, label, tick = 2.2) {
        if (!(x2 > x1)) return;
        pdf.setDrawColor(95, 105, 125);
        pdf.setLineWidth(0.22);
        pdf.line(x1, y, x2, y);
        pdf.line(x1, y - tick, x1, y + tick);
        pdf.line(x2, y - tick, x2, y + tick);
        const ah = 1.6;
        pdf.line(x1, y, x1 + ah, y - ah * .55);
        pdf.line(x1, y, x1 + ah, y + ah * .55);
        pdf.line(x2, y, x2 - ah, y - ah * .55);
        pdf.line(x2, y, x2 - ah, y + ah * .55);
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(7.2);
        pdf.setTextColor(45, 55, 75);
        pdf.text(String(label), (x1 + x2) / 2, y - 1.7, { align: "center" });
      }

      function pdfSegmentName(seg, index) {
        if (state.type === "car") {
          if (seg.kind === "stop") return "STOP";
          const slope = Number(seg.slopePct || 0);
          const runSegs = buildRampGeometry(state.result || invalidResult()).segments.filter(s => s.kind === "run");
          if (seg === runSegs[0]) return `${slope}% START`;
          if (seg === runSegs[runSegs.length - 1]) return `${slope}% END`;
          return `MAIN ${slope}%`;
        }
        if (seg.kind === "landing") return `LANDING ${index + 1}`;
        return `RAMP ${index + 1}`;
      }

      function drawVectorPlanToPDF(pdf, r, x, y, w, h) {
        const geom = buildRampGeometry(r);
        const totalX = Math.max(0.01, geom.totalX);
        const widthM = Math.max(0.01, geom.widthM);
        const scale = Math.min(w / totalX, h / widthM);
        const dw = totalX * scale;
        const dh = widthM * scale;
        const ox = x + (w - dw) / 2;
        const oy = y + (h - dh) / 2;
        const mapX = v => ox + v * scale;

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(10);
        pdf.setTextColor(20, 28, 45);
        pdf.text("PLAN", x, y - 5);

        pdf.setDrawColor(28, 36, 55);
        pdf.setLineWidth(0.45);
        pdf.rect(ox, oy, dw, dh);

        geom.points.forEach((p, i) => {
          const px = mapX(p.x);
          if (i > 0 && i < geom.points.length - 1) {
            pdf.setDrawColor(150, 160, 180);
            pdf.setLineWidth(0.22);
            pdf.line(px, oy, px, oy + dh);
          }
        });

        pdf.setDrawColor(165, 175, 195);
        pdf.setLineWidth(0.18);
        pdf.setLineDashPattern([2, 1.5], 0);
        pdf.line(ox, oy + dh / 2, ox + dw, oy + dh / 2);
        pdf.setLineDashPattern([], 0);

        // Overall dimension above.
        pdfDim(pdf, ox, ox + dw, oy - 6, `TOTAL ${pdfLength(totalX)}`);

        // Segmented dimensions below.
        const dimY = oy + dh + 7;
        geom.segments.forEach((seg, i) => {
          const x1 = mapX(seg.start.x);
          const x2 = mapX(seg.end.x);
          const name = state.type === "car"
            ? (seg.kind === "stop" ? "STOP" : (i === 0 ? `${Number(seg.slopePct || 0)}% START` : i === 1 ? `MAIN ${Number(seg.slopePct || 0)}%` : `${Number(seg.slopePct || 0)}% END`))
            : (seg.kind === "landing" ? "LANDING" : "RAMP");
          pdfDim(pdf, x1, x2, dimY, `${name}  ${pdfLength(seg.len)}`, 1.6);
        });

        // Width dimension.
        const dx = ox - 6;
        pdf.setDrawColor(95,105,125);
        pdf.setLineWidth(0.22);
        pdf.line(dx, oy, dx, oy + dh);
        pdf.line(dx - 2, oy, ox, oy);
        pdf.line(dx - 2, oy + dh, ox, oy + dh);
        pdf.setFontSize(7.2);
        pdf.text(pdfLength(widthM), dx - 1.5, oy + dh / 2, { angle: 90, align: "center" });
      }

      function drawVectorSectionToPDF(pdf, r, x, y, w, h) {
        const geom = buildRampGeometry(r);
        const totalX = Math.max(0.01, geom.totalX);
        const totalZ = Math.max(0.01, geom.totalRise || geom.heightM);
        const scale = Math.min(w / totalX, h / totalZ);
        const dw = totalX * scale;
        const dh = totalZ * scale;
        const ox = x + (w - dw) / 2;
        const baseY = y + h;
        const mapX = v => ox + v * scale;
        const mapY = v => baseY - v * scale;

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(10);
        pdf.setTextColor(20, 28, 45);
        pdf.text("SECTION", x, y - 5);

        pdf.setDrawColor(150, 160, 180);
        pdf.setLineWidth(0.22);
        pdf.line(ox, baseY, ox + dw, baseY);

        pdf.setDrawColor(25, 33, 52);
        pdf.setLineWidth(0.55);
        geom.segments.forEach((seg, i) => {
          const x1 = mapX(seg.start.x), y1 = mapY(seg.start.z);
          const x2 = mapX(seg.end.x), y2 = mapY(seg.end.z);
          if (seg.kind === "stop") pdf.setLineDashPattern([2.2, 1.5], 0);
          else pdf.setLineDashPattern([], 0);
          pdf.line(x1, y1, x2, y2);
          pdf.setLineDashPattern([], 0);

          const segPx = Math.abs(x2 - x1);
          if (segPx > 18) {
            const mx = (x1 + x2) / 2;
            const my = (y1 + y2) / 2 - 2.5;
            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(6.8);
            pdf.setTextColor(55, 65, 85);
            const label = seg.kind === "stop" ? `STOP ${pdfLength(seg.len)}` : `${Number(seg.slopePct || 0)}%  ${pdfLength(seg.len)}`;
            pdf.text(label, mx, my, { align: "center" });
          }
        });

        // Overall length dimension above section.
        pdfDim(pdf, ox, ox + dw, y - 1.5, `TOTAL ${pdfLength(totalX)}`);

        // Segmented dimensions below section.
        const dimY = baseY + 7;
        geom.segments.forEach((seg, i) => {
          const x1 = mapX(seg.start.x), x2 = mapX(seg.end.x);
          const name = state.type === "car"
            ? (seg.kind === "stop" ? "STOP" : (i === 0 ? `${Number(seg.slopePct || 0)}% START` : i === 1 ? `MAIN ${Number(seg.slopePct || 0)}%` : `${Number(seg.slopePct || 0)}% END`))
            : (seg.kind === "landing" ? "LANDING" : "RAMP");
          pdfDim(pdf, x1, x2, dimY, `${name}  ${pdfLength(seg.len)}`, 1.6);
        });

        // Height dimension on left.
        const dx = ox - 7;
        pdf.setDrawColor(95,105,125);
        pdf.setLineWidth(0.22);
        pdf.line(dx, mapY(0), dx, mapY(geom.totalRise));
        pdf.line(dx - 2, mapY(0), ox, mapY(0));
        pdf.line(dx - 2, mapY(geom.totalRise), ox, mapY(geom.totalRise));
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(7.2);
        pdf.setTextColor(45,55,75);
        pdf.text(pdfLength(geom.totalRise), dx - 1.5, (mapY(0) + mapY(geom.totalRise)) / 2, { angle: 90, align: "center" });
      }

      async function downloadPDF() {
        try {
          if (!window.jspdf?.jsPDF) throw new Error("jsPDF is unavailable");
          const r = state.result || calculateCurrent(true) || invalidResult();
          if (!r.valid || r.blocked) throw new Error("No valid ramp result");
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4", compress: true });
          const pageW = pdf.internal.pageSize.getWidth();
          const pageH = pdf.internal.pageSize.getHeight();
          const margin = 16;

          pdf.setFillColor(255,255,255);
          pdf.rect(0,0,pageW,pageH,"F");

          pdf.setFont("helvetica","bold");
          pdf.setFontSize(17);
          pdf.setTextColor(18, 26, 44);
          pdf.text("Ramp Calculation Tool - Technical Sheet", margin, 14);

          const heightM = Number(r.params?.heightCm || 0) / 100;
          const geom = buildRampGeometry(r);
          let summary = "";
          if (state.type === "car") {
            summary = `CAR RAMP   |   HEIGHT ${heightM.toFixed(2)} m   |   MAIN SLOPE ${Number(r.params?.slope || 0)}%   |   ENTRY / EXIT ${Number(r.params?.transitionSlope || 0)}%   |   OVERALL ${geom.totalX.toFixed(2)} m`;
          } else if (state.type === "disabled") {
            summary = `ACCESSIBLE RAMP   |   HEIGHT ${heightM.toFixed(2)} m   |   SLOPE ${Number(r.params?.slope || 0)}%   |   OVERALL ${geom.totalX.toFixed(2)} m`;
          } else {
            summary = `GENERAL RAMP   |   HEIGHT ${heightM.toFixed(2)} m   |   SLOPE ${Number(r.params?.slope || 0)}%   |   OVERALL ${geom.totalX.toFixed(2)} m`;
          }
          pdf.setFont("helvetica","normal");
          pdf.setFontSize(8.5);
          pdf.setTextColor(80, 92, 115);
          pdf.text(summary, margin, 20);

          pdf.setDrawColor(121,161,253);
          pdf.setLineWidth(0.5);
          pdf.line(margin, 24, pageW - margin, 24);

          // True vector drawings. No canvas, screenshot or raster image is used.
          drawVectorPlanToPDF(pdf, r, margin + 5, 39, pageW - (margin + 5) * 2, 42);
          pdf.setDrawColor(222, 227, 235);
          pdf.setLineWidth(0.25);
          pdf.line(margin, 98, pageW - margin, 98);
          drawVectorSectionToPDF(pdf, r, margin + 5, 115, pageW - (margin + 5) * 2, 46);

          pdf.setDrawColor(205, 212, 224);
          pdf.setLineWidth(0.25);
          pdf.line(margin, pageH - 13, pageW - margin, pageH - 13);
          pdf.setFont("helvetica","normal");
          pdf.setFontSize(7.8);
          pdf.setTextColor(110, 120, 140);
          pdf.text("Generated from Ramp Calculator", margin, pageH - 7.5);
          pdf.setFont("helvetica","bold");
          pdf.text("Pixel Studio", pageW - margin, pageH - 7.5, { align: "right" });

          pdf.save(`ramp-${state.type}-vector-technical-sheet-${selectedLengthUnit()}.pdf`);
          showToast(state.lang === "fa" ? "PDF وکتور دانلود شد" : "Vector PDF downloaded");
        } catch (error) {
          console.error(error);
          showToast(state.lang === "fa" ? "خطا در ساخت PDF" : "PDF export failed");
        }
      }

'''

          s = s[:start] + new_pdf + s[end:]
          # html2canvas is no longer needed and must not be used by PDF export.
          s = re.sub(r'\s*<script src="https://cdnjs\.cloudflare\.com/ajax/libs/html2canvas/1\.4\.1/html2canvas\.min\.js"></script>\s*', '\n', s, count=1)
          s = re.sub(r'(<div class="footer-pill" id="versionBadge">)v[^<]+(</div>)', r'\1v2.10.9\2', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit vector PDF export
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git add index.html
          git commit -m "Export true vector technical PDF"
          git push
