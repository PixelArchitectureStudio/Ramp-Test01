name: Add PDF export button

on:
  push:
    paths:
      - '.github/workflows/pdf-export-button.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch PDF export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Replace SVG export button with PDF.
          s = s.replace('id="svgBtn"', 'id="pdfBtn"')
          s = re.sub(r'(<button class="small-btn" id="pdfBtn">.*?<span>)SVG(</span>)', r'\1PDF\2', s, count=1, flags=re.S)

          # Load PDF dependencies before the app's inline script.
          deps = '''  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>\n  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>\n'''
          app_script = '  <script>\n    (() => {'
          if 'html2canvas.min.js' not in s and app_script in s:
              s = s.replace(app_script, deps + app_script, 1)

          pdf_func = r'''
      async function downloadPDF() {
        try {
          const target = $(".drawing-area");
          if (!target || !window.html2canvas || !window.jspdf?.jsPDF) {
            throw new Error("PDF libraries are unavailable");
          }

          const canvas = await window.html2canvas(target, {
            scale: Math.min(3, Math.max(2, window.devicePixelRatio || 2)),
            useCORS: true,
            backgroundColor: getComputedStyle(target).backgroundColor || "#ffffff",
            logging: false
          });

          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4", compress: true });
          const pageW = pdf.internal.pageSize.getWidth();
          const pageH = pdf.internal.pageSize.getHeight();
          const margin = 10;
          const maxW = pageW - margin * 2;
          const maxH = pageH - margin * 2;
          const ratio = canvas.width / canvas.height;
          let drawW = maxW;
          let drawH = drawW / ratio;
          if (drawH > maxH) {
            drawH = maxH;
            drawW = drawH * ratio;
          }
          const x = (pageW - drawW) / 2;
          const y = (pageH - drawH) / 2;
          pdf.addImage(canvas.toDataURL("image/png", 1), "PNG", x, y, drawW, drawH, undefined, "FAST");
          pdf.save(`ramp-${state.type}-${state.view}-${selectedLengthUnit()}.pdf`);
          showToast(t("downloaded"));
        } catch (error) {
          console.error(error);
          showToast(state.lang === "fa" ? "خطا در ساخت PDF" : "PDF export failed");
        }
      }
'''

          if 'async function downloadPDF()' not in s:
              marker = '      function downloadDXF() {'
              if marker in s:
                  s = s.replace(marker, pdf_func + '\n' + marker, 1)

          # Point button event to PDF export.
          s = s.replace('$("#svgBtn").addEventListener("click", downloadSVG);', '$("#pdfBtn").addEventListener("click", downloadPDF);')

          # Update app version.
          s = re.sub(r'(<div class="footer-pill" id="versionBadge">)v[^<]+(</div>)', r'\1v2.10.7\2', s, count=1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit updated index
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Replace SVG export with PDF export"
          git push
